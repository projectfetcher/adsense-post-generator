name: Generate AdSense Posts

on:
  repository_dispatch:
    types: [generate_adsense_posts]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run post generator
        env:
          GITHUB_EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python generate_posts.py
