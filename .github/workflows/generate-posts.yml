name: Generate AI Posts

on:
  repository_dispatch:
    types: [generate_adsense_posts]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate AI Posts
        id: generate
        env:
          GITHUB_EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "Starting AI post generation..."
          python generate_posts.py
          echo "Generation complete."
