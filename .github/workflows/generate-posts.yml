name: Generate AI Posts

on:
  repository_dispatch:
    types: [generate_adsense_posts]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - run: python generate_posts.py
        env:
          GITHUB_EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
