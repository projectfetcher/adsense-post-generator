name: Generate AI Posts

on:
  workflow_dispatch:
    inputs:
      site_url:
        required: true
      wp_user:
        required: true
      wp_pass:
        required: true
      topics:
        required: true
      site_description:
        required: false
        default: "a general blog"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install sentencepiece protobuf
          pip install -r requirements.txt

      - name: Run generator
        env:
          SITE_URL: ${{ inputs.site_url }}
          WP_USER: ${{ inputs.wp_user }}
          WP_PASS: ${{ inputs.wp_pass }}
          TOPICS: ${{ inputs.topics }}
          SITE_DESC: ${{ inputs.site_description }}
        run: |
          echo "Starting AI post generation..." > logs.txt
          python generate_posts.py | tee -a logs.txt
          echo "Generation complete." >> logs.txt

      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add progress.json articles.json logs.txt
          git commit -m "AI posts generated" || echo "Nothing to commit"
          git push
